<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; height: auto; display: block;" fill="none">
  <defs>
    <!-- SmartMart Brand Theme Gradients: Primary #258B3E, PrimaryDark #1A632C, PrimaryLight #EAF5ED -->
    <linearGradient id="scBgBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082113" />
      <stop offset="50%" stop-color="#0F3820" />
      <stop offset="100%" stop-color="#05170B" />
    </linearGradient>

    <linearGradient id="laserGradBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#258B3E" stop-opacity="0" />
      <stop offset="25%" stop-color="#28A745" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#70DB8E" stop-opacity="1" />
      <stop offset="75%" stop-color="#28A745" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#258B3E" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserConeBrand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#258B3E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#258B3E" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144627" />
      <stop offset="100%" stop-color="#0D2E1A" />
    </linearGradient>

    <filter id="laserGlowBrand" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .laser-sweep-beam {
        animation: animLaserSweep 2.4s infinite ease-in-out;
      }
      .transfer-stream-pulse {
        stroke-dasharray: 8 6;
        animation: animTransferDash 1.4s linear infinite;
      }
      .beep-wave-1 {
        animation: animBeepWave 2.4s infinite ease-out 1.2s;
      }
      .beep-wave-2 {
        animation: animBeepWave 2.4s infinite ease-out 1.4s;
      }
      .card-verified-glow {
        animation: animCardBorderPulse 2.4s infinite ease-in-out;
      }
      .camera-lens-dot {
        animation: animCameraPulse 1.6s infinite ease-in-out;
      }

      @keyframes animLaserSweep {
        0% { opacity: 0.3; }
        45% { opacity: 1; }
        55% { opacity: 1; }
        90% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }
      @keyframes animTransferDash {
        to { stroke-dashoffset: -28; }
      }
      @keyframes animBeepWave {
        0% { r: 6px; opacity: 0.9; stroke-width: 2; }
        100% { r: 24px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes animCardBorderPulse {
        0%, 40% { stroke: #258B3E; stroke-width: 1.5; }
        55% { stroke: #70DB8E; stroke-width: 2.2; }
        70%, 100% { stroke: #258B3E; stroke-width: 1.5; }
      }
      @keyframes animCameraPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Outer Rounded Container (Brand Green Canvas) -->
  <rect width="920" height="280" rx="16" fill="url(#scBgBrand)" stroke="#258B3E" stroke-width="1.5" />

  <!-- Top Status Header (Clear left/right margins) -->
  <g transform="translate(32, 28)">
    <circle class="camera-lens-dot" cx="6" cy="6" r="4.5" fill="#2ECC71" />
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#EAF5ED" letter-spacing="1.2">
      HARDWARE CAMERA SCANNER ENGINE (60 FPS) • <tspan fill="#70DB8E">APP THEME: #258B3E</tspan>
    </text>
  </g>
  <g transform="translate(730, 20)">
    <rect width="158" height="22" rx="11" fill="#1A632C" stroke="#258B3E" stroke-width="0.8" />
    <text x="79" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#EAF5ED">
      SCAN LATENCY: &lt; 85ms
    </text>
  </g>

  <!-- ==================== LEFT: CAMERA VIEWFINDER ==================== -->
  <g transform="translate(32, 54)">
    <!-- Viewfinder Background -->
    <rect width="340" height="198" rx="12" fill="#05170B" stroke="#1A632C" stroke-width="1.2" />

    <!-- Corner Reticles (Targeting Brackets) -->
    <path d="M 28 44 L 28 28 L 44 28" stroke="#258B3E" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 296 28 L 312 28 L 312 44" stroke="#258B3E" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 28 152 L 28 168 L 44 168" stroke="#258B3E" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 296 168 L 312 168 L 312 152" stroke="#258B3E" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Central Barcode Simulation (EAN-13: 8901262010158) -->
    <g transform="translate(80, 52)" fill="#70DB8E">
      <!-- Guard bars -->
      <rect x="0" y="0" width="3" height="74" />
      <rect x="5" y="0" width="2" height="74" />
      <!-- Left half -->
      <rect x="13" y="0" width="4" height="66" />
      <rect x="21" y="0" width="3" height="66" />
      <rect x="28" y="0" width="5" height="66" />
      <rect x="37" y="0" width="2" height="66" />
      <rect x="43" y="0" width="6" height="66" />
      <rect x="53" y="0" width="3" height="66" />
      <rect x="60" y="0" width="2" height="66" />
      <rect x="66" y="0" width="5" height="66" />
      <rect x="75" y="0" width="3" height="66" />
      <rect x="82" y="0" width="2" height="66" />
      <!-- Center guard -->
      <rect x="88" y="0" width="3" height="74" />
      <rect x="93" y="0" width="3" height="74" />
      <!-- Right half -->
      <rect x="101" y="0" width="4" height="66" />
      <rect x="109" y="0" width="2" height="66" />
      <rect x="115" y="0" width="6" height="66" />
      <rect x="124" y="0" width="3" height="66" />
      <rect x="131" y="0" width="5" height="66" />
      <rect x="140" y="0" width="2" height="66" />
      <rect x="146" y="0" width="4" height="66" />
      <rect x="154" y="0" width="5" height="66" />
      <rect x="163" y="0" width="3" height="66" />
      <rect x="170" y="0" width="2" height="74" />
      <rect x="175" y="0" width="3" height="74" />

      <!-- Digits -->
      <text x="22" y="86" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="800" fill="#C2E2CB" letter-spacing="4">
        8901262010158
      </text>
    </g>

    <!-- Animated Sweeping Laser Beam (Green #258B3E) -->
    <g transform="translate(47, 44)">
      <g class="laser-sweep-beam">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 75; 0 0" keyTimes="0; 0.5; 1" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3; 1; 1; 0.3" keyTimes="0; 0.45; 0.9; 1" dur="2.4s" repeatCount="indefinite" />
        <rect x="0" y="0" width="246" height="2.5" fill="url(#laserGradBrand)" filter="url(#laserGlowBrand)" />
        <polygon points="0,0 246,0 216,16 30,16" fill="url(#laserConeBrand)" />
      </g>
    </g>

    <text x="170" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#70DB8E">
      Viewfinder active • Align barcode within green brackets
    </text>
  </g>

  <!-- ==================== CENTER: SIGNAL & AUDIO PING ==================== -->
  <g transform="translate(388, 142)">
    <circle class="beep-wave-1" cx="24" cy="0" r="10" stroke="#70DB8E" fill="none">
      <animate attributeName="r" values="6; 24" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9; 0" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <circle class="beep-wave-2" cx="24" cy="0" r="16" stroke="#258B3E" fill="none">
      <animate attributeName="r" values="6; 24" dur="2.4s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9; 0" dur="2.4s" begin="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="24" cy="0" r="5" fill="#2ECC71" />

    <line class="transfer-stream-pulse" x1="0" y1="0" x2="48" y2="0" stroke="#258B3E" stroke-width="3" stroke-linecap="round" />
    <polygon points="52,0 44,-5 44,5" fill="#258B3E" />
    <text x="24" y="-14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#70DB8E">
      BEEP! (SCAN OK)
    </text>
  </g>

  <!-- ==================== RIGHT: VERIFIED PRODUCT CARD ==================== -->
  <!-- Anchored stably at x=460, y=54. Width 428px. Perfectly balances 32px left/right margins. -->
  <g transform="translate(460, 54)">
    <!-- Card Frame -->
    <rect class="card-verified-glow" width="428" height="198" rx="12" fill="url(#cardGradBrand)" stroke="#258B3E" stroke-width="1.5" />

    <!-- Product Icon Container (Brand Theme Styled Emerald Box: #0E331B, NOT stark white) -->
    <rect x="18" y="18" width="56" height="56" rx="10" fill="#0A2D16" stroke="#258B3E" stroke-width="1.2" />
    <g transform="translate(31, 26)">
      <!-- Vector Milk Bottle/Carton Icon -->
      <path d="M12 4h6l3 4v22H9V8l3-4z" stroke="#70DB8E" stroke-width="2" fill="none" stroke-linejoin="round" />
      <line x1="12" y1="4" x2="18" y2="4" stroke="#70DB8E" stroke-width="2" />
      <line x1="9" y1="12" x2="21" y2="12" stroke="#258B3E" stroke-width="1.8" />
      <circle cx="15" cy="20" r="3" fill="#2ECC71" />
    </g>

    <!-- Product Title & Details -->
    <text x="86" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="800" fill="#FFFFFF">
      Amul Taaza Toned Milk
    </text>
    <text x="86" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#C2E2CB">
      1 Litre Pouch • Dairy &amp; Fresh Chillers
    </text>

    <!-- Pricing Row (Selling Price, Struck MRP, Save Badge) -->
    <g transform="translate(86, 70)">
      <!-- Selling Price -->
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#70DB8E">
        ₹54.00
      </text>
      <!-- Struck MRP -->
      <text x="90" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#9CA3AF" text-decoration="line-through">
        ₹58.00
      </text>
      <!-- Save Badge Pill (Brand Theme Emerald #0A2D16 with Primary #258B3E stroke) -->
      <rect x="150" y="5" width="86" height="20" rx="6" fill="#258B3E" />
      <text x="157" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">
        SAVE ₹4 (7%)
      </text>
    </g>

    <!-- Inventory Stock & Aisle Shelf Location Pill -->
    <g transform="translate(18, 120)">
      <rect width="392" height="28" rx="7" fill="#071E10" stroke="#1A632C" stroke-width="0.8" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#EAF5ED">
        Stock: <tspan fill="#70DB8E" font-weight="800">24 Units</tspan> (Buffer &gt; 5) • Location: <tspan fill="#FFFFFF">Aisle 2, Dairy Chiller #1</tspan>
      </text>
    </g>

    <!-- Bottom Verified Pill (Brand Primary #258B3E) -->
    <g transform="translate(18, 156)">
      <rect width="392" height="26" rx="7" fill="#258B3E" fill-opacity="0.3" stroke="#258B3E" stroke-width="1.2" />
      <circle cx="16" cy="13" r="4" fill="#2ECC71" />
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.4">
        VERIFIED SKU • ADDED TO POS REGISTER CART (QTY: 1)
      </text>
      <text x="378" y="17" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#70DB8E">
        ✓ MATCH
      </text>
    </g>
  </g>
</svg>
