<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2017" />
      <stop offset="100%" stop-color="#05140D" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0" />
      <stop offset="25%" stop-color="#FF5252" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2ECC71" stop-opacity="1" />
      <stop offset="75%" stop-color="#FF5252" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2ECC71" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143729" />
      <stop offset="100%" stop-color="#0C241B" />
    </linearGradient>
    <filter id="neonGreenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .laser-line {
        animation: sweepLaser 2.6s infinite ease-in-out;
      }
      .laser-cone {
        animation: sweepLaserCone 2.6s infinite ease-in-out;
      }
      .reticle-corner {
        animation: pulseReticle 2.6s infinite ease-in-out;
      }
      .flow-pulse {
        stroke-dasharray: 8 6;
        animation: dashMove 1.5s linear infinite;
      }
      .card-ping {
        animation: cardPop 2.6s infinite ease-in-out;
      }
      .verified-badge {
        animation: badgeGlow 2.6s infinite ease-in-out;
      }

      @keyframes sweepLaser {
        0% { transform: translateY(0px); opacity: 0.2; }
        40% { opacity: 1; }
        50% { transform: translateY(85px); opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      @keyframes sweepLaserCone {
        0% { transform: translateY(0px) scaleY(0.2); opacity: 0.1; }
        50% { transform: translateY(0px) scaleY(1); opacity: 0.45; }
        100% { transform: translateY(0px) scaleY(0.2); opacity: 0.1; }
      }
      @keyframes pulseReticle {
        0%, 100% { stroke: #27AE60; stroke-width: 2.5; }
        50% { stroke: #A3E635; stroke-width: 3.5; filter: drop-shadow(0 0 6px #A3E635); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -28; }
      }
      @keyframes cardPop {
        0%, 40% { transform: scale(0.985); }
        55% { transform: scale(1.015); }
        70%, 100% { transform: scale(1); }
      }
      @keyframes badgeGlow {
        0%, 45% { opacity: 0.7; }
        55% { opacity: 1; filter: drop-shadow(0 0 8px #2ECC71); }
        100% { opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="920" height="280" rx="16" fill="url(#scBg)" stroke="#1F4D38" stroke-width="1.2" />

  <!-- Section Header -->
  <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#2ECC71" letter-spacing="1.5">
    REAL-TIME HARDWARE BARCODE SCANNER ENGINE (60 FPS)
  </text>
  <text x="760" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#74C69D">
    LATENCY: &lt; 85ms
  </text>

  <!-- LEFT: Scanner Viewfinder Frame -->
  <g transform="translate(36, 56)">
    <!-- Viewfinder Background -->
    <rect width="320" height="196" rx="12" fill="#040F0A" stroke="#163827" stroke-width="1" />

    <!-- Corner Brackets (Targeting Reticles) -->
    <path class="reticle-corner" d="M 28 44 L 28 28 L 44 28" stroke="#27AE60" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path class="reticle-corner" d="M 276 28 L 292 28 L 292 44" stroke="#27AE60" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path class="reticle-corner" d="M 28 152 L 28 168 L 44 168" stroke="#27AE60" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path class="reticle-corner" d="M 276 168 L 292 168 L 292 152" stroke="#27AE60" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Simulated EAN-13 Barcode -->
    <g transform="translate(68, 48)" fill="#E8F5E9">
      <!-- Bars -->
      <rect x="0" y="0" width="3" height="74" />
      <rect x="6" y="0" width="2" height="74" />
      <rect x="12" y="0" width="5" height="66" />
      <rect x="20" y="0" width="2" height="66" />
      <rect x="25" y="0" width="6" height="66" />
      <rect x="34" y="0" width="3" height="66" />
      <rect x="42" y="0" width="2" height="66" />
      <rect x="48" y="0" width="5" height="66" />
      <rect x="58" y="0" width="3" height="66" />
      <rect x="66" y="0" width="2" height="66" />
      <rect x="74" y="0" width="4" height="66" />
      <rect x="82" y="0" width="2" height="66" />
      <!-- Center guard -->
      <rect x="88" y="0" width="3" height="74" />
      <rect x="94" y="0" width="3" height="74" />
      <!-- Right half -->
      <rect x="102" y="0" width="4" height="66" />
      <rect x="110" y="0" width="2" height="66" />
      <rect x="116" y="0" width="6" height="66" />
      <rect x="125" y="0" width="3" height="66" />
      <rect x="132" y="0" width="5" height="66" />
      <rect x="141" y="0" width="2" height="66" />
      <rect x="147" y="0" width="4" height="66" />
      <rect x="155" y="0" width="5" height="66" />
      <rect x="164" y="0" width="3" height="66" />
      <rect x="171" y="0" width="2" height="74" />
      <rect x="176" y="0" width="3" height="74" />

      <!-- Human Readable Digits -->
      <text x="24" y="86" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="800" fill="#A7D7C5" letter-spacing="4">
        8901262010158
      </text>
    </g>

    <!-- Animated Laser Beam (Sweeping down and up) -->
    <g class="laser-line" transform="translate(40, 42)">
      <rect x="0" y="0" width="240" height="2" fill="url(#laserGrad)" filter="url(#neonGreenGlow)" />
      <polygon points="0,0 240,0 210,18 30,18" fill="url(#laserBeam)" />
    </g>

    <text x="160" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#52B788">
      Point viewfinder at retail SKU barcode
    </text>
  </g>

  <!-- CENTER: Dynamic Transfer Stream / Arrow -->
  <g transform="translate(372, 140)">
    <line class="flow-pulse" x1="0" y1="0" x2="60" y2="0" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" />
    <polygon points="62,0 52,-6 52,6" fill="#2ECC71" />
    <text x="30" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#A3E635">
      MATCH
    </text>
  </g>

  <!-- RIGHT: Bottom Sheet Matched Product Card -->
  <g class="card-ping" transform="translate(450, 56)">
    <!-- Card Frame -->
    <rect width="434" height="196" rx="12" fill="url(#panelGrad)" stroke="#27AE60" stroke-width="1.2" />

    <!-- Product Image Placeholder / Icon -->
    <rect x="18" y="20" width="60" height="60" rx="10" fill="#1B4D36" stroke="#2D5A43" stroke-width="1" />
    <text x="32" y="58" font-size="28">🥛</text>

    <!-- Product Name & Unit -->
    <text x="90" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">
      Amul Taaza Toned Milk
    </text>
    <text x="90" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#95D5B2">
      1 Litre Pouch • Dairy &amp; Fresh Chillers
    </text>

    <!-- Pricing Row -->
    <g transform="translate(90, 74)">
      <!-- Selling Price -->
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#A3E635">
        ₹54.00
      </text>
      <!-- Struck MRP -->
      <text x="96" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#6C757D" text-decoration="line-through">
        ₹58.00
      </text>
      <!-- Discount Badge -->
      <rect x="156" y="8" width="76" height="20" rx="6" fill="#2D5A43" />
      <text x="166" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#52B788">
        SAVE ₹4 (7%)
      </text>
    </g>

    <!-- Store Inventory & Aisle Shelf Location Info -->
    <g transform="translate(18, 126)">
      <rect width="398" height="28" rx="7" fill="#0D251C" stroke="#1F4D38" stroke-width="0.8" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#D8F3DC">
        📦 Stock: <tspan fill="#A3E635" font-weight="800">24 Units</tspan> (Buffer &gt; 5) • 📍 <tspan fill="#FFFFFF">Aisle 2, Dairy Chiller #1</tspan>
      </text>
    </g>

    <!-- Bottom Action Pill -->
    <g class="verified-badge" transform="translate(18, 162)">
      <rect width="398" height="22" rx="6" fill="#2ECC71" fill-opacity="0.2" stroke="#2ECC71" stroke-width="1" />
      <text x="200" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#2ECC71" letter-spacing="0.6">
        ✓ VERIFIED SKU • ADDED TO POS REGISTER CART (QTY: 1)
      </text>
    </g>
  </g>
</svg>

