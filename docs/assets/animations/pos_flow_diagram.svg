<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="180" fill="none">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071911" />
      <stop offset="100%" stop-color="#0D281E" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4D36" />
      <stop offset="100%" stop-color="#0E2D1F" />
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5A43" />
      <stop offset="100%" stop-color="#18432F" />
    </linearGradient>
    <filter id="stepGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pipe-pulse {
        stroke-dasharray: 6 8;
        animation: pipeDash 1.2s linear infinite;
      }
      .photon-1 {
        animation: travelPhoton 3s infinite linear;
      }
      @keyframes pipeDash {
        to { stroke-dashoffset: -28; }
      }
      @keyframes travelPhoton {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(670px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="920" height="180" rx="14" fill="url(#flowBg)" stroke="#1F4D38" stroke-width="1.2" />

  <!-- Title Banner -->
  <text x="36" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#2ECC71" letter-spacing="1.2">
    THE 10-SECOND CHECKOUT PIPELINE (100% OFFLINE-CAPABLE)
  </text>
  <text x="750" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#74C69D">
    ZERO PRINTER LATENCY
  </text>

  <!-- Flow Pipeline Line (Connecting all 5 nodes) -->
  <g transform="translate(100, 85)">
    <!-- Base track -->
    <line x1="0" y1="0" x2="720" y2="0" stroke="#143D2B" stroke-width="4" stroke-linecap="round" />
    <!-- Animated pulsing stream -->
    <line class="pipe-pulse" x1="0" y1="0" x2="720" y2="0" stroke="#2ECC71" stroke-width="2.5" stroke-linecap="round" />
    <!-- Photon Bullet -->
    <circle class="photon-1" cx="0" cy="0" r="5" fill="#A3E635" filter="url(#stepGlow)" />
  </g>

  <!-- STEP 1: Scan Barcode -->
  <g transform="translate(36, 46)">
    <rect width="144" height="78" rx="10" fill="url(#stepGrad)" stroke="#27AE60" stroke-width="1" />
    <circle cx="28" cy="24" r="12" fill="#133829" />
    <text x="21" y="29" font-size="14">📷</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">1. 60 FPS Scan</text>
    <text x="14" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#95D5B2">EAN-13 / QR Decoder</text>
    <text x="14" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#2ECC71">&lt; 85ms detection</text>
  </g>

  <!-- STEP 2: Cart Calculation -->
  <g transform="translate(216, 46)">
    <rect width="144" height="78" rx="10" fill="url(#stepGrad)" stroke="#27AE60" stroke-width="1" />
    <circle cx="28" cy="24" r="12" fill="#133829" />
    <text x="21" y="29" font-size="14">🛒</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">2. Cart Engine</text>
    <text x="14" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#95D5B2">Auto-Discount &amp; GST</text>
    <text x="14" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#2ECC71">Live Save ₹X badge</text>
  </g>

  <!-- STEP 3: Payment Split -->
  <g transform="translate(396, 46)">
    <rect width="144" height="78" rx="10" fill="url(#stepGrad)" stroke="#27AE60" stroke-width="1" />
    <circle cx="28" cy="24" r="12" fill="#133829" />
    <text x="21" y="29" font-size="14">💳</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">3. Payment Mode</text>
    <text x="14" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#95D5B2">Cash Change / UPI / Card</text>
    <text x="14" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#2ECC71">1-Tap tender calc</text>
  </g>

  <!-- STEP 4: Local Vector PDF Generation -->
  <g transform="translate(576, 46)">
    <rect width="144" height="78" rx="10" fill="url(#activeGrad)" stroke="#A3E635" stroke-width="1.2" />
    <circle cx="28" cy="24" r="12" fill="#133829" />
    <text x="21" y="29" font-size="14">📄</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#A3E635">4. Local Vector PDF</text>
    <text x="14" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#E8F5E9">A4 Green Card Design</text>
    <text x="14" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#A3E635">Zero network latency</text>
  </g>

  <!-- STEP 5: WhatsApp Direct Dispatch -->
  <g transform="translate(756, 46)">
    <rect width="138" height="78" rx="10" fill="url(#activeGrad)" stroke="#2ECC71" stroke-width="1.2" />
    <circle cx="26" cy="24" r="12" fill="#25D366" fill-opacity="0.25" />
    <text x="19" y="29" font-size="14">💬</text>
    <text x="46" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">5. WhatsApp</text>
    <text x="12" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#E8F5E9">Target Customer Phone</text>
    <text x="12" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#2ECC71">Zero thermal paper</text>
  </g>

  <!-- Footer explanation note -->
  <text x="460" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#74C69D">
    Total transaction duration: <tspan fill="#A3E635" font-weight="700">~10 seconds</tspan> • Replaces ₹18,000/yr thermal roll consumables with instant branded digital customer touchpoints.
  </text>
</svg>

