<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" fill="none">
  <defs>
    <!-- Brand Gradients: SmartMart Primary #258B3E, PrimaryDark #1A632C, PrimaryLight #EAF5ED -->
    <linearGradient id="flowBgBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082113" />
      <stop offset="50%" stop-color="#0F331E" />
      <stop offset="100%" stop-color="#06180D" />
    </linearGradient>

    <linearGradient id="cardGradStep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164A29" />
      <stop offset="100%" stop-color="#0E331B" />
    </linearGradient>

    <linearGradient id="cardGradHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E6136" />
      <stop offset="100%" stop-color="#144626" />
    </linearGradient>

    <filter id="photonGlowBrand" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pipeline-dash-brand {
        stroke-dasharray: 6 8;
        animation: animPipeDash 1.2s linear infinite;
      }
      .photon-traveler-1 {
        animation: animPhotonTravel 2.8s infinite linear;
      }
      .photon-traveler-2 {
        animation: animPhotonTravel 2.8s infinite linear 1.4s;
      }
      .step-border-pulse {
        animation: animStepBorder 2.8s infinite ease-in-out;
      }

      @keyframes animPipeDash {
        to { stroke-dashoffset: -28; }
      }
      @keyframes animPhotonTravel {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(700px); opacity: 0; }
      }
      @keyframes animStepBorder {
        0%, 100% { stroke: #258B3E; stroke-width: 1.2; }
        50% { stroke: #70DB8E; stroke-width: 2; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="920" height="220" rx="16" fill="url(#flowBgBrand)" stroke="#258B3E" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="6" cy="6" r="4.5" fill="#258B3E" />
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#EAF5ED" letter-spacing="1.2">
      THE 10-SECOND CHECKOUT PIPELINE • <tspan fill="#70DB8E">100% OFFLINE-CAPABLE ARCHITECTURE</tspan>
    </text>
  </g>
  <g transform="translate(710, 20)">
    <rect width="178" height="22" rx="11" fill="#1A632C" stroke="#258B3E" stroke-width="0.8" />
    <text x="89" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#EAF5ED">
      CONSUMABLES: ₹0 / ZERO PAPER
    </text>
  </g>

  <!-- Central Traveling Pipeline Track -->
  <g transform="translate(90, 106)">
    <line x1="0" y1="0" x2="740" y2="0" stroke="#103820" stroke-width="5" stroke-linecap="round" />
    <line class="pipeline-dash-brand" x1="0" y1="0" x2="740" y2="0" stroke="#258B3E" stroke-width="3" stroke-linecap="round" />
    <circle class="photon-traveler-1" cx="0" cy="0" r="6" fill="#70DB8E" filter="url(#photonGlowBrand)" />
    <circle class="photon-traveler-2" cx="0" cy="0" r="5" fill="#EAF5ED" filter="url(#photonGlowBrand)" />
  </g>

  <!-- ==================== 5 STAGE CARDS ==================== -->

  <!-- STEP 1: 60 FPS Camera Scan -->
  <g transform="translate(32, 54)">
    <rect class="step-border-pulse" width="150" height="100" rx="12" fill="url(#cardGradStep)" stroke="#258B3E" stroke-width="1.2" />
    <rect x="12" y="12" width="28" height="28" rx="7" fill="#EAF5ED" />
    <!-- Vector Camera Icon -->
    <path d="M19 22h3l1.5-2.5h5l1.5 2.5h3a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H19a1.5 1.5 0 0 1-1.5-1.5v-7A1.5 1.5 0 0 1 19 22zm7 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="#1A632C" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">1. 60 FPS Scan</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#70DB8E">&lt; 85ms Latency</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">CameraKit stream</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">EAN-13, UPC, QR</text>
    <circle cx="75" cy="100" r="4" fill="#258B3E" />
  </g>

  <!-- STEP 2: Smart Cart Engine -->
  <g transform="translate(212, 54)">
    <rect class="step-border-pulse" width="150" height="100" rx="12" fill="url(#cardGradStep)" stroke="#258B3E" stroke-width="1.2" />
    <rect x="12" y="12" width="28" height="28" rx="7" fill="#EAF5ED" />
    <!-- Vector Shopping Cart Icon -->
    <path d="M18 19h2l1.6 7.5h8.8l1.6-5.5H22m2 7.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" stroke="#1A632C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">2. Cart Engine</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#70DB8E">Auto-Discount</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">Real-time savings</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">GST 5% breakdown</text>
    <circle cx="75" cy="100" r="4" fill="#258B3E" />
  </g>

  <!-- STEP 3: Multi-Mode Tender -->
  <g transform="translate(392, 54)">
    <rect class="step-border-pulse" width="150" height="100" rx="12" fill="url(#cardGradStep)" stroke="#258B3E" stroke-width="1.2" />
    <rect x="12" y="12" width="28" height="28" rx="7" fill="#EAF5ED" />
    <!-- Vector Payment Card Icon -->
    <rect x="18" y="21" width="16" height="10" rx="1.5" stroke="#1A632C" stroke-width="1.5" fill="none" />
    <line x1="18" y1="24.5" x2="34" y2="24.5" stroke="#1A632C" stroke-width="1.5" />
    <circle cx="22" cy="28" r="1" fill="#1A632C" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">3. Tender &amp; Pay</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#70DB8E">Cash / UPI / Card</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">Auto cash change calc</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">Soundbox &amp; UPI QR</text>
    <circle cx="75" cy="100" r="4" fill="#258B3E" />
  </g>

  <!-- STEP 4: Local Vector PDF Generation -->
  <g transform="translate(572, 54)">
    <rect class="step-border-pulse" width="150" height="100" rx="12" fill="url(#cardGradHighlight)" stroke="#70DB8E" stroke-width="1.5" />
    <rect x="12" y="12" width="28" height="28" rx="7" fill="#EAF5ED" />
    <!-- Vector Document PDF Icon -->
    <path d="M20 19h8l4 4v9a1.5 1.5 0 0 1-1.5 1.5H20A1.5 1.5 0 0 1 18.5 32v-11.5A1.5 1.5 0 0 1 20 19z" stroke="#1A632C" stroke-width="1.5" fill="none" />
    <line x1="22" y1="26" x2="28" y2="26" stroke="#1A632C" stroke-width="1.2" />
    <line x1="22" y1="29" x2="26" y2="29" stroke="#1A632C" stroke-width="1.2" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#70DB8E">4. Vector PDF</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#EAF5ED">On-Device Engine</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#EAF5ED">A4 Green Card Design</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#EAF5ED">100% Offline Ready</text>
    <circle cx="75" cy="100" r="4" fill="#70DB8E" />
  </g>

  <!-- STEP 5: Direct WhatsApp File Share -->
  <g transform="translate(752, 54)">
    <rect class="step-border-pulse" width="136" height="100" rx="12" fill="url(#cardGradHighlight)" stroke="#25D366" stroke-width="1.5" />
    <rect x="12" y="12" width="28" height="28" rx="7" fill="#EAF5ED" />
    <!-- Vector WhatsApp Chat Icon -->
    <path d="M26 19a5.5 5.5 0 0 0-4.8 8.2L20 31l3.9-1.2A5.5 5.5 0 1 0 26 19z" stroke="#25D366" stroke-width="1.6" fill="none" stroke-linejoin="round" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">5. WhatsApp</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#25D366">Direct PDF File</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#EAF5ED">To customer phone</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#EAF5ED">Zero dead/fake links</text>
    <circle cx="68" cy="100" r="4" fill="#25D366" />
  </g>

  <!-- Bottom Explanatory Summary Bar (Wide clearance: left text stops before right badge) -->
  <g transform="translate(32, 172)">
    <rect width="856" height="32" rx="8" fill="#0D2E1A" stroke="#1A632C" stroke-width="1" />
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#EAF5ED">
      ⚡ <tspan fill="#70DB8E" font-weight="800">Total Cycle Time: ~10 Seconds</tspan> • Replaces ₹18,000/yr thermal rolls with instant WhatsApp GST Tax PDFs.
    </text>
    <rect x="734" y="6" width="110" height="20" rx="10" fill="#1A632C" stroke="#258B3E" stroke-width="0.8" />
    <text x="789" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#70DB8E">
      OFFLINE READY ✓
    </text>
  </g>
</svg>
