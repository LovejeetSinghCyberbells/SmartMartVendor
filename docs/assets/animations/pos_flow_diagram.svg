<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; height: auto; display: block;" fill="none">
  <defs>
    <!-- SmartMart Brand Gradients: Primary #258B3E, PrimaryDark #1A632C, PrimaryLight #EAF5ED -->
    <linearGradient id="posFlowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082113" />
      <stop offset="50%" stop-color="#0F3820" />
      <stop offset="100%" stop-color="#05170B" />
    </linearGradient>

    <linearGradient id="posCardGradStep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144627" />
      <stop offset="100%" stop-color="#0D2E1A" />
    </linearGradient>

    <linearGradient id="posCardGradHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E6136" />
      <stop offset="100%" stop-color="#123B22" />
    </linearGradient>

    <filter id="posGlowBrand" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pos-conveyor-stream {
        stroke-dasharray: 6 8;
        animation: animPosDash 1.2s linear infinite;
      }
      .pos-photon-1 {
        animation: animPosPhoton1 2.8s infinite linear;
      }
      .pos-photon-2 {
        animation: animPosPhoton2 2.8s infinite linear 1.4s;
      }
      .pos-card-pulse {
        animation: animPosBorder 2.8s infinite ease-in-out;
      }
      .pulse-beacon {
        animation: animPulseBeacon 1.8s infinite ease-in-out;
      }

      @keyframes animPosDash {
        to { stroke-dashoffset: -28; }
      }
      @keyframes animPosPhoton1 {
        0% { cx: 70px; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { cx: 780px; opacity: 0; }
      }
      @keyframes animPosPhoton2 {
        0% { cx: 70px; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { cx: 780px; opacity: 0; }
      }
      @keyframes animPosBorder {
        0%, 100% { stroke: #258B3E; stroke-width: 1.2; }
        50% { stroke: #70DB8E; stroke-width: 1.8; }
      }
      @keyframes animPulseBeacon {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="920" height="220" rx="16" fill="url(#posFlowBg)" stroke="#258B3E" stroke-width="1.5" />

  <!-- Top Status Header -->
  <g transform="translate(32, 28)">
    <circle class="pulse-beacon" cx="6" cy="6" r="4.5" fill="#2ECC71" />
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#EAF5ED" letter-spacing="1.2">
      THE 10-SECOND CHECKOUT PIPELINE • <tspan fill="#70DB8E">100% OFFLINE-CAPABLE ARCHITECTURE</tspan>
    </text>
  </g>
  <g transform="translate(710, 20)">
    <rect width="178" height="22" rx="11" fill="#1A632C" stroke="#258B3E" stroke-width="0.8" />
    <text x="89" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#EAF5ED">
      CONSUMABLES: ₹0 / ZERO PAPER
    </text>
  </g>

  <!-- Central Traveling Pipeline Track -->
  <g transform="translate(0, 104)">
    <line x1="80" y1="0" x2="840" y2="0" stroke="#0D2E1A" stroke-width="5" stroke-linecap="round" />
    <line class="pos-conveyor-stream" x1="80" y1="0" x2="840" y2="0" stroke="#258B3E" stroke-width="3" stroke-linecap="round" />
    <circle class="pos-photon-1" cy="0" r="6" fill="#70DB8E" filter="url(#posGlowBrand)">
      <animate attributeName="cx" values="70; 780" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.9; 1" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle class="pos-photon-2" cy="0" r="5" fill="#EAF5ED" filter="url(#posGlowBrand)">
      <animate attributeName="cx" values="70; 780" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.9; 1" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== 5 PIPELINE STAGE CARDS ==================== -->
  <!-- Card Width: 158px each, Gap: 16px. X-coords: 32, 206, 380, 554, 728 -->

  <!-- STEP 1: 60 FPS Hardware Scan -->
  <g transform="translate(32, 54)">
    <rect class="pos-card-pulse" width="158" height="100" rx="12" fill="url(#posCardGradStep)" stroke="#258B3E" stroke-width="1.2" />
    <!-- Sleek Emerald Icon Container (#0A2D16 with #258B3E border) -->
    <rect x="12" y="12" width="28" height="28" rx="8" fill="#0A2D16" stroke="#258B3E" stroke-width="1" />
    <path d="M19 22h3l1.5-2.5h5l1.5 2.5h3a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H19a1.5 1.5 0 0 1-1.5-1.5v-7A1.5 1.5 0 0 1 19 22zm7 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="#70DB8E" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">1. 60 FPS Scan</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#70DB8E">&lt; 85ms Latency</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">CameraKit stream</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">EAN-13, UPC, QR</text>
    <circle cx="79" cy="100" r="4" fill="#258B3E" />
  </g>

  <!-- STEP 2: Cart Engine & Savings -->
  <g transform="translate(206, 54)">
    <rect class="pos-card-pulse" width="158" height="100" rx="12" fill="url(#posCardGradStep)" stroke="#258B3E" stroke-width="1.2" />
    <!-- Sleek Emerald Icon Container -->
    <rect x="12" y="12" width="28" height="28" rx="8" fill="#0A2D16" stroke="#258B3E" stroke-width="1" />
    <path d="M18 20h2.5l2 8h9l2-6H22" stroke="#70DB8E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="23" cy="30" r="1.5" fill="#70DB8E" />
    <circle cx="30" cy="30" r="1.5" fill="#70DB8E" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">2. Cart Engine</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#70DB8E">Auto Discounts</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">Live Save ₹X badge</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">5% GST breakdown</text>
    <circle cx="79" cy="100" r="4" fill="#258B3E" />
  </g>

  <!-- STEP 3: Multi-Mode Tender & Pay -->
  <g transform="translate(380, 54)">
    <rect class="pos-card-pulse" width="158" height="100" rx="12" fill="url(#posCardGradStep)" stroke="#258B3E" stroke-width="1.2" />
    <!-- Sleek Emerald Icon Container -->
    <rect x="12" y="12" width="28" height="28" rx="8" fill="#0A2D16" stroke="#258B3E" stroke-width="1" />
    <rect x="17" y="20" width="18" height="12" rx="1.5" stroke="#70DB8E" stroke-width="1.5" fill="none" />
    <line x1="17" y1="24" x2="35" y2="24" stroke="#70DB8E" stroke-width="1.2" />
    <circle cx="21" cy="28" r="1" fill="#70DB8E" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">3. Tender &amp; Pay</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#70DB8E">Cash / UPI / Card</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">Auto change calc</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#C2E2CB">Soundbox &amp; UPI QR</text>
    <circle cx="79" cy="100" r="4" fill="#258B3E" />
  </g>

  <!-- STEP 4: On-Device Vector PDF -->
  <g transform="translate(554, 54)">
    <rect class="pos-card-pulse" width="158" height="100" rx="12" fill="url(#posCardGradHighlight)" stroke="#70DB8E" stroke-width="1.5" />
    <!-- Sleek Emerald Icon Container -->
    <rect x="12" y="12" width="28" height="28" rx="8" fill="#0A2D16" stroke="#70DB8E" stroke-width="1" />
    <path d="M20 19h7l4 4v9a1.5 1.5 0 0 1-1.5 1.5H20A1.5 1.5 0 0 1 18.5 32v-11.5A1.5 1.5 0 0 1 20 19z" stroke="#70DB8E" stroke-width="1.5" fill="none" />
    <line x1="22" y1="26" x2="27" y2="26" stroke="#70DB8E" stroke-width="1.2" />
    <line x1="22" y1="29" x2="25" y2="29" stroke="#70DB8E" stroke-width="1.2" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#70DB8E">4. Vector PDF</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#EAF5ED">On-Device Engine</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#EAF5ED">A4 Green Card Design</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#EAF5ED">100% Offline Ready</text>
    <circle cx="79" cy="100" r="4" fill="#70DB8E" />
  </g>

  <!-- STEP 5: Direct WhatsApp Dispatch -->
  <g transform="translate(728, 54)">
    <rect class="pos-card-pulse" width="160" height="100" rx="12" fill="url(#posCardGradHighlight)" stroke="#25D366" stroke-width="1.5" />
    <!-- Sleek Emerald Icon Container -->
    <rect x="12" y="12" width="28" height="28" rx="8" fill="#0A2D16" stroke="#25D366" stroke-width="1" />
    <path d="M26 19a5.5 5.5 0 0 0-4.8 8.2L20 31l3.9-1.2A5.5 5.5 0 1 0 26 19z" stroke="#25D366" stroke-width="1.6" fill="none" stroke-linejoin="round" />
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">5. WhatsApp</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#25D366">Direct PDF File</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#EAF5ED">To customer phone</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#EAF5ED">Zero dead/fake links</text>
    <circle cx="80" cy="100" r="4" fill="#25D366" />
  </g>

  <!-- Bottom Explanatory Summary Bar (Guaranteed Zero Overlap: text ends at x=460, badge starts at x=726) -->
  <g transform="translate(32, 170)">
    <rect width="856" height="32" rx="8" fill="#0D2E1A" stroke="#1A632C" stroke-width="1" />
    <!-- Lightning Bolt Vector -->
    <polygon points="20,9 15,17 19,17 18,24 24,16 20,16" fill="#70DB8E" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#EAF5ED">
      <tspan fill="#70DB8E" font-weight="800">Total Cycle Time: ~10s</tspan> • Instant on-device WhatsApp GST Tax PDFs.
    </text>
    <rect x="726" y="6" width="118" height="20" rx="10" fill="#1A632C" stroke="#258B3E" stroke-width="0.8" />
    <text x="785" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#70DB8E">
      OFFLINE READY ✓
    </text>
  </g>
</svg>
