<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; height: auto; display: block;" fill="none">
  <defs>
    <!-- SmartMart Theme Gradients: Primary #258B3E, PrimaryDark #1A632C, PrimaryLight #EAF5ED -->
    <linearGradient id="pagerBgBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082113" />
      <stop offset="50%" stop-color="#0F3820" />
      <stop offset="100%" stop-color="#05170B" />
    </linearGradient>

    <linearGradient id="pagerCardCashier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144627" />
      <stop offset="100%" stop-color="#0D2E1A" />
    </linearGradient>

    <linearGradient id="pagerCardManager" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A5630" />
      <stop offset="100%" stop-color="#103820" />
    </linearGradient>

    <style>
      .soundwave-pulse-1 {
        animation: animSoundWave 2s infinite ease-out;
      }
      .soundwave-pulse-2 {
        animation: animSoundWave 2s infinite ease-out 0.4s;
      }
      .soundwave-pulse-3 {
        animation: animSoundWave 2s infinite ease-out 0.8s;
      }
      .alert-pill-pulse {
        animation: animAlertBlink 1.4s infinite ease-in-out;
      }
      .pager-stream {
        stroke-dasharray: 8 6;
        animation: animPagerDash 1.2s linear infinite;
      }
      .pulse-beacon {
        animation: animPulseBeacon 1.8s infinite ease-in-out;
      }

      @keyframes animSoundWave {
        0% { r: 10px; opacity: 1; stroke-width: 2.2; }
        100% { r: 38px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes animAlertBlink {
        0%, 100% { fill: #DC2626; }
        50% { fill: #EF4444; }
      }
      @keyframes animPagerDash {
        to { stroke-dashoffset: -28; }
      }
      @keyframes animPulseBeacon {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="920" height="230" rx="16" fill="url(#pagerBgBrand)" stroke="#258B3E" stroke-width="1.5" />

  <!-- Top Title Header -->
  <g transform="translate(32, 28)">
    <circle class="pulse-beacon" cx="6" cy="6" r="4.5" fill="#2ECC71" />
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#EAF5ED" letter-spacing="1.2">
      HARDWARE-FREE STORE FLOOR PAGER &amp; INTERCOM • <tspan fill="#70DB8E">ZERO WALKIE-TALKIES</tspan>
    </text>
  </g>
  <g transform="translate(730, 20)">
    <rect width="158" height="22" rx="11" fill="#1A632C" stroke="#258B3E" stroke-width="0.8" />
    <text x="79" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#EAF5ED">
      LATENCY: &lt; 50ms (WSS)
    </text>
  </g>

  <!-- ==================== LEFT: CASHIER TERMINAL ==================== -->
  <g transform="translate(32, 54)">
    <rect width="336" height="154" rx="12" fill="url(#pagerCardCashier)" stroke="#258B3E" stroke-width="1.2" />
    <!-- Sleek Emerald Container for Megaphone Icon (#0A2D16, NOT stark white) -->
    <rect x="14" y="12" width="28" height="28" rx="8" fill="#0A2D16" stroke="#258B3E" stroke-width="1" />
    <path d="M20 22v4h3l4 3v-10l-4 3h-3zm8-2a3.5 3.5 0 0 1 0 5m2-7a6 6 0 0 1 0 9" stroke="#70DB8E" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF">
      Counter #2 Cashier Desk
    </text>
    <text x="48" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#70DB8E">
      One-Tap Manager Summon Trigger
    </text>

    <!-- Request Details Box -->
    <g transform="translate(14, 48)">
      <rect width="308" height="48" rx="8" fill="#071E10" stroke="#1A632C" stroke-width="0.8" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#EAF5ED">
        Reason: <tspan fill="#F59E0B">Price Override (Bulk Order)</tspan>
      </text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#C2E2CB">
        Location: Billing Counter 2 • Customer Waiting
      </text>
    </g>

    <!-- Urgent Dispatch Status Pill (Strictly Bounded Inside Card: Zero text overflow) -->
    <g transform="translate(14, 108)">
      <rect width="308" height="28" rx="6" fill="#DC2626" fill-opacity="0.25" stroke="#DC2626" stroke-width="0.8" />
      <circle class="pulse-beacon" cx="14" cy="14" r="3.5" fill="#EF4444" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#FCA5A5" letter-spacing="0.3">
        SUMMON DISPATCHED • MANAGERS NOTIFIED
      </text>
      <rect x="252" y="5" width="46" height="18" rx="4" fill="#258B3E" />
      <text x="275" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">
        SENT ✓
      </text>
    </g>
  </g>

  <!-- ==================== CENTER: WEBSOCKET & HAPTIC SIGNAL ==================== -->
  <g transform="translate(382, 131)">
    <!-- Expanding Soundwave Rings -->
    <circle class="soundwave-pulse-1" cx="42" cy="0" r="14" stroke="#258B3E" fill="none">
      <animate attributeName="r" values="10; 38" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 0" dur="2s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="2.2; 0.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle class="soundwave-pulse-2" cx="42" cy="0" r="24" stroke="#70DB8E" fill="none">
      <animate attributeName="r" values="10; 38" dur="2s" begin="0.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 0" dur="2s" begin="0.4s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="2.2; 0.5" dur="2s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <circle class="soundwave-pulse-3" cx="42" cy="0" r="34" stroke="#258B3E" fill="none">
      <animate attributeName="r" values="10; 38" dur="2s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 0" dur="2s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="2.2; 0.5" dur="2s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="42" cy="0" r="7" fill="#2ECC71" />

    <!-- Pulse Line -->
    <line class="pager-stream" x1="0" y1="0" x2="84" y2="0" stroke="#70DB8E" stroke-width="3" stroke-linecap="round" />
    <polygon points="88,0 78,-5 78,5" fill="#70DB8E" />

    <text x="42" y="-20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" fill="#EAF5ED">
      HAPTIC BUZZ
    </text>
    <text x="42" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#C2E2CB">
      WebSocket WSS
    </text>
  </g>

  <!-- ==================== RIGHT: STORE MANAGER POPUP OVERLAY ==================== -->
  <!-- Anchored stably at x=488. Width 400px. Perfectly balances 32px left/right margins. -->
  <g transform="translate(488, 54)">
    <rect width="400" height="154" rx="12" fill="url(#pagerCardManager)" stroke="#258B3E" stroke-width="1.5" />

    <!-- Alert Header Banner: Clean separation between Badge & Manager Name (Zero Collision) -->
    <rect class="alert-pill-pulse" x="14" y="12" width="94" height="22" rx="6" fill="#DC2626" />
    <text x="61" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      URGENT PAGER
    </text>

    <text x="118" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">
      Rahul Sharma (Store Manager)
    </text>

    <!-- Overlay Body Card -->
    <g transform="translate(14, 46)">
      <rect width="372" height="50" rx="8" fill="#071E10" stroke="#1A632C" stroke-width="0.8" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">
        Summon: Counter 2 Cashier Desk
      </text>
      <text x="14" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#C2E2CB">
        "Cashier needs manager PIN override for 15% wholesale discount."
      </text>
    </g>

    <!-- 1-Tap Acknowledge Button (Brand Primary #258B3E) -->
    <g transform="translate(14, 106)">
      <rect width="372" height="32" rx="8" fill="#258B3E" />
      <text x="186" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
        ✓ ACKNOWLEDGE &amp; ON MY WAY (COUNTER 2)
      </text>
    </g>
  </g>
</svg>
