<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Brand Gradients: SmartMart Primary #258B3E, PrimaryDark #1A632C, PrimaryLight #EAF5ED -->
    <linearGradient id="pagerBgBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082113" />
      <stop offset="50%" stop-color="#0F331E" />
      <stop offset="100%" stop-color="#06180D" />
    </linearGradient>

    <linearGradient id="pagerCardCashier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144627" />
      <stop offset="100%" stop-color="#0D2E1A" />
    </linearGradient>

    <linearGradient id="pagerCardManager" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4C30" />
      <stop offset="100%" stop-color="#103820" />
    </linearGradient>

    <style>
      .soundwave-pulse-1 {
        animation: animSoundWave 2s infinite ease-out;
      }
      .soundwave-pulse-2 {
        animation: animSoundWave 2s infinite ease-out 0.4s;
      }
      .soundwave-pulse-3 {
        animation: animSoundWave 2s infinite ease-out 0.8s;
      }
      .alert-pill-pulse {
        animation: animAlertBlink 1.4s infinite ease-in-out;
      }
      .pager-stream {
        stroke-dasharray: 8 6;
        animation: animPagerDash 1.2s linear infinite;
      }

      @keyframes animSoundWave {
        0% { r: 12px; opacity: 1; stroke-width: 2.5; }
        100% { r: 42px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes animAlertBlink {
        0%, 100% { fill: #DC2626; }
        50% { fill: #EF4444; filter: drop-shadow(0 0 8px #EF4444); }
      }
      @keyframes animPagerDash {
        to { stroke-dashoffset: -28; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="920" height="220" rx="16" fill="url(#pagerBgBrand)" stroke="#258B3E" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(36, 28)">
    <circle cx="6" cy="6" r="4.5" fill="#258B3E" />
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#EAF5ED" letter-spacing="1.2">
      HARDWARE-FREE STORE FLOOR PAGER &amp; INTERCOM • <tspan fill="#70DB8E">ZERO WALKIE-TALKIES</tspan>
    </text>
  </g>
  <g transform="translate(730, 28)">
    <rect width="154" height="22" rx="11" fill="#1A632C" stroke="#258B3E" stroke-width="0.8" />
    <text x="77" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#EAF5ED">
      LATENCY: &lt; 50ms (WSS)
    </text>
  </g>

  <!-- ==================== LEFT: CASHIER TERMINAL ==================== -->
  <g transform="translate(36, 56)">
    <rect width="330" height="136" rx="12" fill="url(#pagerCardCashier)" stroke="#258B3E" stroke-width="1.2" />
    <!-- Header -->
    <rect x="14" y="12" width="28" height="28" rx="7" fill="#EAF5ED" />
    <text x="21" y="31" font-size="14">📢</text>
    <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">
      Counter #2 Cashier Desk
    </text>
    <text x="48" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#70DB8E">
      One-Tap Manager Summon Trigger
    </text>

    <!-- Request Details Box -->
    <g transform="translate(14, 52)">
      <rect width="302" height="42" rx="8" fill="#092112" stroke="#1A632C" stroke-width="0.8" />
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#EAF5ED">
        Reason: <tspan fill="#F59E0B">Price Override (Bulk Order)</tspan>
      </text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#C2E2CB">
        Location: Billing Counter 2 • Customer Waiting
      </text>
    </g>

    <!-- Urgent Dispatch Status -->
    <g transform="translate(14, 102)">
      <rect width="302" height="22" rx="6" fill="#DC2626" fill-opacity="0.25" stroke="#DC2626" stroke-width="0.8" />
      <text x="151" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#FCA5A5" letter-spacing="0.5">
        🚨 SUMMON SENT • TRANSMITTING TO FLOOR MANAGERS
      </text>
    </g>
  </g>

  <!-- ==================== CENTER: WEBSOCKET & HAPTIC SIGNAL ==================== -->
  <g transform="translate(390, 124)">
    <!-- Expanding Soundwave Rings -->
    <circle class="soundwave-pulse-1" cx="40" cy="0" r="16" stroke="#258B3E" fill="none" />
    <circle class="soundwave-pulse-2" cx="40" cy="0" r="26" stroke="#70DB8E" fill="none" />
    <circle class="soundwave-pulse-3" cx="40" cy="0" r="36" stroke="#258B3E" fill="none" />
    <circle cx="40" cy="0" r="8" fill="#258B3E" />

    <!-- Pulse Line -->
    <line class="pager-stream" x1="0" y1="0" x2="80" y2="0" stroke="#70DB8E" stroke-width="3" stroke-linecap="round" />
    <polygon points="84,0 74,-6 74,6" fill="#70DB8E" />

    <text x="40" y="-22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" fill="#EAF5ED">
      HAPTIC BUZZ
    </text>
    <text x="40" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#C2E2CB">
      WebSocket WSS
    </text>
  </g>

  <!-- ==================== RIGHT: STORE MANAGER POPUP OVERLAY ==================== -->
  <g transform="translate(490, 56)">
    <rect width="394" height="136" rx="12" fill="url(#pagerCardManager)" stroke="#258B3E" stroke-width="1.5" />
    <!-- Alert Header Banner -->
    <rect class="alert-pill-pulse" x="14" y="12" width="94" height="22" rx="6" fill="#DC2626" />
    <text x="61" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      🚨 URGENT PAGER
    </text>

    <text x="116" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">
      Rahul Sharma (Store Manager)
    </text>

    <!-- Overlay Body Card -->
    <g transform="translate(14, 42)">
      <rect width="366" height="48" rx="8" fill="#0C2616" stroke="#1A632C" stroke-width="0.8" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">
        Summon: Counter 2 Cashier Desk
      </text>
      <text x="14" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#C2E2CB">
        "Cashier needs manager PIN override for 15% wholesale discount."
      </text>
    </g>

    <!-- 1-Tap Acknowledge Button (Brand Primary #258B3E) -->
    <g transform="translate(14, 98)">
      <rect width="366" height="26" rx="7" fill="#258B3E" />
      <text x="183" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
        ✓ ACKNOWLEDGE &amp; ON MY WAY (COUNTER 2)
      </text>
    </g>
  </g>
</svg>

