<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; height: auto; display: block;" fill="none">
  <defs>
    <!-- Brand Gradients: SmartMart Primary #258B3E, PrimaryDark #1A632C, PrimaryLight #EAF5ED -->
    <linearGradient id="heroBgBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06180D" />
      <stop offset="50%" stop-color="#0F3820" />
      <stop offset="100%" stop-color="#041208" />
    </linearGradient>

    <radialGradient id="heroGlowBrand" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#258B3E" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#072012" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="heroOrbBrand" cx="82%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#1A632C" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0F3820" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154928" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0C3019" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="heroTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#EAF5ED" />
      <stop offset="100%" stop-color="#70DB8E" />
    </linearGradient>

    <linearGradient id="heroLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#258B3E" stop-opacity="0" />
      <stop offset="30%" stop-color="#258B3E" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#70DB8E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#258B3E" stop-opacity="0" />
    </linearGradient>

    <filter id="heroDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <style>
      .blink-dot-brand {
        animation: animPulseDot 2s infinite ease-in-out;
      }
      .wave-pulse-brand {
        animation: animWavePulse 2.8s infinite ease-out;
      }
      .chip-card-pulse {
        animation: animChipBorder 3s infinite ease-in-out;
      }

      @keyframes animPulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes animWavePulse {
        0% { r: 12px; opacity: 0.8; }
        100% { r: 38px; opacity: 0; }
      }
      @keyframes animChipBorder {
        0%, 100% { stroke: #258B3E; stroke-width: 1.2; }
        50% { stroke: #70DB8E; stroke-width: 1.8; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="920" height="340" rx="20" fill="url(#heroBgBrand)" />
  <rect width="920" height="340" rx="20" fill="url(#heroGlowBrand)" />
  <rect width="920" height="340" rx="20" fill="url(#heroOrbBrand)" />
  <rect width="918" height="338" x="1" y="1" rx="19" stroke="#258B3E" stroke-width="1.5" stroke-opacity="0.6" fill="none" />

  <!-- Grid Overlay -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="60" y1="0" x2="60" y2="340" />
    <line x1="160" y1="0" x2="160" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="460" y1="0" x2="460" y2="340" />
    <line x1="560" y1="0" x2="560" y2="340" />
    <line x1="660" y1="0" x2="660" y2="340" />
    <line x1="760" y1="0" x2="760" y2="340" />
    <line x1="860" y1="0" x2="860" y2="340" />
    <line x1="0" y1="60" x2="920" y2="60" />
    <line x1="0" y1="140" x2="920" y2="140" />
    <line x1="0" y1="220" x2="920" y2="220" />
    <line x1="0" y1="300" x2="920" y2="300" />
  </g>

  <!-- Radar Status Orb (Top Right) -->
  <g transform="translate(820, 70)">
    <circle cx="0" cy="0" r="16" fill="#1A632C" opacity="0.6" />
    <circle class="wave-pulse-brand" cx="0" cy="0" r="14" stroke="#258B3E" stroke-width="1.5" fill="none">
      <animate attributeName="r" values="12; 38" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="6" fill="#2ECC71" />
  </g>

  <!-- Top System Badge Pill -->
  <g transform="translate(50, 42)">
    <rect width="316" height="30" rx="15" fill="#0C2E1A" stroke="#258B3E" stroke-width="1" />
    <circle class="blink-dot-brand" cx="20" cy="15" r="5" fill="#2ECC71" />
    <text x="34" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#EAF5ED" letter-spacing="1">SMARTMART VENDOR OS • v2.4.0</text>
    <rect x="246" y="6" width="62" height="18" rx="9" fill="#258B3E" />
    <text x="256" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">ONLINE</text>
  </g>

  <!-- Main Hero Title -->
  <text x="50" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#heroTextGrad)" letter-spacing="-0.5">
    SmartMart Vendor &amp; In-Store POS
  </text>
  <text x="50" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#EAF5ED" letter-spacing="0.2">
    Next-Gen Supermarket Operating System • 10-Second Checkout • Omnichannel Dark Store Picking
  </text>

  <!-- Glowing Accent Divider Line -->
  <rect x="50" y="180" width="820" height="2" fill="url(#heroLineGrad)" />

  <!-- 4 Feature Cards (Chips) - Symmetrically Spaced at x=50, 258, 466, 674 -->
  <!-- Chip 1: 10s Instant Checkout -->
  <g transform="translate(50, 204)">
    <rect class="chip-card-pulse" width="192" height="68" rx="12" fill="url(#heroCardGrad)" stroke="#258B3E" stroke-width="1.2" filter="url(#heroDropShadow)" />
    <!-- Sleek Emerald Container (#0A2D16, NOT stark white) -->
    <rect x="12" y="14" width="38" height="38" rx="9" fill="#0A2D16" stroke="#258B3E" stroke-width="1" />
    <polygon points="31,22 23,33 29,33 27,44 37,31 31,31" fill="#70DB8E" />
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">10s Checkout</text>
    <text x="60" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#C2E2CB">Zero wait queues</text>
  </g>

  <!-- Chip 2: On-Device PDF Generator -->
  <g transform="translate(258, 204)">
    <rect class="chip-card-pulse" width="192" height="68" rx="12" fill="url(#heroCardGrad)" stroke="#258B3E" stroke-width="1.2" filter="url(#heroDropShadow)" />
    <!-- Sleek Emerald Container -->
    <rect x="12" y="14" width="38" height="38" rx="9" fill="#0A2D16" stroke="#258B3E" stroke-width="1" />
    <path d="M24 24h9l4 4v12a1.5 1.5 0 0 1-1.5 1.5H24A1.5 1.5 0 0 1 22.5 40V25.5A1.5 1.5 0 0 1 24 24z" stroke="#70DB8E" stroke-width="1.6" fill="none" />
    <line x1="26" y1="31" x2="33" y2="31" stroke="#70DB8E" stroke-width="1.3" />
    <line x1="26" y1="35" x2="31" y2="35" stroke="#70DB8E" stroke-width="1.3" />
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Vector Tax PDF</text>
    <text x="60" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#C2E2CB">On-device local</text>
  </g>

  <!-- Chip 3: WhatsApp GST Invoicing -->
  <g transform="translate(466, 204)">
    <rect class="chip-card-pulse" width="192" height="68" rx="12" fill="url(#heroCardGrad)" stroke="#258B3E" stroke-width="1.2" filter="url(#heroDropShadow)" />
    <!-- Sleek Emerald Container -->
    <rect x="12" y="14" width="38" height="38" rx="9" fill="#0A2D16" stroke="#258B3E" stroke-width="1" />
    <path d="M33 24a6 6 0 0 0-5.3 8.8L26 37l4.3-1.3A6 6 0 1 0 33 24z" stroke="#25D366" stroke-width="1.6" fill="none" stroke-linejoin="round" />
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Direct WhatsApp</text>
    <text x="60" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#C2E2CB">Zero paper rolls</text>
  </g>

  <!-- Chip 4: 100% Offline-First Engine -->
  <g transform="translate(674, 204)">
    <rect class="chip-card-pulse" width="196" height="68" rx="12" fill="url(#heroCardGrad)" stroke="#258B3E" stroke-width="1.2" filter="url(#heroDropShadow)" />
    <!-- Sleek Emerald Container -->
    <rect x="12" y="14" width="38" height="38" rx="9" fill="#0A2D16" stroke="#258B3E" stroke-width="1" />
    <path d="M23 39h2.5v-3H23v3zm4.5 0H30v-7h-2.5v7zm4.5 0h2.5v-11H32v11zm4.5 0H39v-15h-2.5v15z" fill="#70DB8E" />
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">100% Offline-First</text>
    <text x="60" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#C2E2CB">Autonomous SQLite</text>
  </g>

  <!-- Bottom Platform Footer Bar -->
  <g transform="translate(50, 298)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#70DB8E" letter-spacing="0.3">
      STACK: React Native 0.88 (TurboModules) • TypeScript 5.8 • Theme #258B3E • CameraKit 60 FPS • SQLite Sync • iOS &amp; Android
    </text>
  </g>
</svg>
