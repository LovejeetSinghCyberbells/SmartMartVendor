<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="340" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081C15" />
      <stop offset="50%" stop-color="#0F2F24" />
      <stop offset="100%" stop-color="#061610" />
    </linearGradient>
    <radialGradient id="glowGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#2D5A43" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#081C15" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="greenOrb" cx="80%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#27AE60" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F2F24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0D281E" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E8F5E9" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27AE60" stop-opacity="0" />
      <stop offset="30%" stop-color="#27AE60" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#A3E635" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#27AE60" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .blink-dot {
        animation: pulseDot 2s infinite ease-in-out;
      }
      .chip-float-1 {
        animation: floatY1 4s infinite ease-in-out;
      }
      .chip-float-2 {
        animation: floatY2 4.5s infinite ease-in-out;
      }
      .chip-float-3 {
        animation: floatY1 5s infinite ease-in-out 0.5s;
      }
      .chip-float-4 {
        animation: floatY2 4.2s infinite ease-in-out 1s;
      }
      .radar-sweep {
        animation: rotateSweep 12s linear infinite;
        transform-origin: 820px 70px;
      }
      .wave-pulse {
        animation: wavePulse 3s infinite ease-out;
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes floatY1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes floatY2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes wavePulse {
        0% { r: 12px; opacity: 0.8; }
        100% { r: 38px; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="920" height="340" rx="20" fill="url(#bgGrad)" />
  <rect width="920" height="340" rx="20" fill="url(#glowGlow)" />
  <rect width="920" height="340" rx="20" fill="url(#greenOrb)" />
  <rect width="918" height="338" x="1" y="1" rx="19" stroke="#2D5A43" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- Grid Overlay -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="60" y1="0" x2="60" y2="340" />
    <line x1="160" y1="0" x2="160" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="460" y1="0" x2="460" y2="340" />
    <line x1="560" y1="0" x2="560" y2="340" />
    <line x1="660" y1="0" x2="660" y2="340" />
    <line x1="760" y1="0" x2="760" y2="340" />
    <line x1="860" y1="0" x2="860" y2="340" />
    <line x1="0" y1="60" x2="920" y2="60" />
    <line x1="0" y1="140" x2="920" y2="140" />
    <line x1="0" y1="220" x2="920" y2="220" />
    <line x1="0" y1="300" x2="920" y2="300" />
  </g>

  <!-- Radar / System Status Orb (Top Right) -->
  <g transform="translate(820, 70)">
    <circle cx="0" cy="0" r="16" fill="#1B4332" opacity="0.6" />
    <circle class="wave-pulse" cx="0" cy="0" r="14" stroke="#27AE60" stroke-width="1.5" fill="none" />
    <circle cx="0" cy="0" r="6" fill="#2ECC71" filter="url(#neonGlow)" />
    <line class="radar-sweep" x1="0" y1="0" x2="42" y2="0" stroke="#A3E635" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Status Pill -->
  <g transform="translate(50, 42)">
    <rect width="310" height="30" rx="15" fill="#133829" stroke="#27AE60" stroke-width="1" stroke-opacity="0.6" />
    <circle class="blink-dot" cx="16" cy="15" r="4.5" fill="#2ECC71" filter="url(#neonGlow)" />
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#A3E635" letter-spacing="1.2">SMARTMART VENDOR OS • v2.4.0</text>
    <rect x="238" y="6" width="62" height="18" rx="9" fill="#27AE60" fill-opacity="0.25" />
    <text x="248" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">ONLINE</text>
  </g>

  <!-- Main Hero Titles -->
  <text x="50" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
    SmartMart Vendor &amp; In-Store POS
  </text>
  <text x="50" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#A7D7C5" letter-spacing="0.2">
    Next-Gen Supermarket Operating System • 10-Second Checkout • Omnichannel Dark Store Picking
  </text>

  <!-- Glowing Accent Divider Line -->
  <rect x="50" y="180" width="820" height="2" fill="url(#accentLine)" />

  <!-- 4 Feature Cards (Chips) -->
  <!-- Chip 1: 10s Instant Checkout -->
  <g class="chip-float-1" transform="translate(50, 204)">
    <rect width="192" height="68" rx="12" fill="url(#cardGrad)" stroke="#2D5A43" stroke-width="1" filter="url(#dropShadow)" />
    <rect x="12" y="14" width="38" height="38" rx="9" fill="#133829" />
    <text x="21" y="40" font-size="20">⚡</text>
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">10s Checkout</text>
    <text x="60" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#74C69D">Zero wait queues</text>
  </g>

  <!-- Chip 2: On-Device PDF Generator -->
  <g class="chip-float-2" transform="translate(258, 204)">
    <rect width="192" height="68" rx="12" fill="url(#cardGrad)" stroke="#2D5A43" stroke-width="1" filter="url(#dropShadow)" />
    <rect x="12" y="14" width="38" height="38" rx="9" fill="#133829" />
    <text x="21" y="40" font-size="20">📄</text>
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">A4 Vector Tax PDF</text>
    <text x="60" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#74C69D">Instant on-device</text>
  </g>

  <!-- Chip 3: WhatsApp GST Invoicing -->
  <g class="chip-float-3" transform="translate(466, 204)">
    <rect width="192" height="68" rx="12" fill="url(#cardGrad)" stroke="#2D5A43" stroke-width="1" filter="url(#dropShadow)" />
    <rect x="12" y="14" width="38" height="38" rx="9" fill="#133829" />
    <text x="21" y="40" font-size="20">💬</text>
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Direct WhatsApp</text>
    <text x="60" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#74C69D">Paperless dispatch</text>
  </g>

  <!-- Chip 4: 100% Offline-First Engine -->
  <g class="chip-float-4" transform="translate(674, 204)">
    <rect width="196" height="68" rx="12" fill="url(#cardGrad)" stroke="#2D5A43" stroke-width="1" filter="url(#dropShadow)" />
    <rect x="12" y="14" width="38" height="38" rx="9" fill="#133829" />
    <text x="21" y="40" font-size="20">📶</text>
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">100% Offline-First</text>
    <text x="60" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#74C69D">Auto-sync queue</text>
  </g>

  <!-- Bottom Platform Footer Bar -->
  <g transform="translate(50, 298)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#52B788" letter-spacing="0.3">
      STACK: React Native 0.88 (TurboModules) • TypeScript 5.8 • 60 FPS CameraKit • Local SQLite Sync • iOS &amp; Android
    </text>
  </g>
</svg>

